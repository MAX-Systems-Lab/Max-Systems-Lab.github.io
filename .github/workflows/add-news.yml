name: Add news / paper

# Run from GitHub: Actions tab -> "Add news / paper" -> Run workflow.
# Works from a phone browser too. See HOW_TO_UPDATE.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What are you adding?"
        required: true
        type: choice
        options:
          - arxiv # value = arXiv id or URL
          - paper # value = an existing key in papers.bib
          - bibtex # value = BibTeX text pasted in the box
          - text # value = the news sentence (Markdown allowed)
      value:
        description: "arXiv id/URL, bib key, pasted BibTeX, or news text"
        required: true
        type: string
      area:
        description: "Research area for new papers"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - perf
          - compiler
          - hetero
          - data
          - security
      type:
        description: "News tag (optional): paper, preprint, award, talk, people, grant"
        required: false
        type: string
      date:
        description: "Date YYYY-MM-DD (optional, default today)"
        required: false
        type: string
      selected:
        description: "Feature the paper on the home page"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run add_news.py
        env:
          MODE: ${{ inputs.mode }}
          VALUE: ${{ inputs.value }}
          AREA: ${{ inputs.area }}
          TYPE: ${{ inputs.type }}
          DATE: ${{ inputs.date }}
          SELECTED: ${{ inputs.selected }}
        run: |
          args=()
          [ -n "$AREA" ] && args+=(--area "$AREA")
          [ -n "$TYPE" ] && args+=(--type "$TYPE")
          [ -n "$DATE" ] && args+=(--date "$DATE")
          [ "$SELECTED" = "true" ] && args+=(--selected)
          if [ "$MODE" = "bibtex" ]; then
            printf '%s' "$VALUE" | python3 bin/add_news.py bibtex - "${args[@]}"
          else
            python3 bin/add_news.py "$MODE" "$VALUE" "${args[@]}"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _news _bibliography
          if git diff --cached --quiet; then
            echo "Nothing to commit."; exit 0
          fi
          git commit -m "Add news: ${{ inputs.mode }}"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
