- name: Santosh Pandey
  role: pi
  title: Principal Investigator
  photo: professor.jpeg
  bio: >
    Santosh leads MAX Systems Lab at the University of South Florida. His research uses machine learning
    to model and optimize computer systems, spanning deep-learning-based microarchitecture simulation
    (SimNet, TAO), CPU performance modeling (Concorde, with Google), and GPU-accelerated graph and ML
    systems. His work on Concorde was selected as an **IEEE Micro Top Pick (2026)**, recognizing one of
    the most significant computer architecture papers of the year.
  links:
    website: https://concept-inversion.github.io
    scholar: https://scholar.google.com/citations?user=4jtGttIAAAAJ
    github: https://github.com/concept-inversion

