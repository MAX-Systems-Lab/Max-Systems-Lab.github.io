name: MAX Systems Lab
pi: Santosh Pandey
pi_url: https://concept-inversion.github.io
affiliation: "University of South Florida" # e.g. "Department of Computer Science and Engineering, University of ..."

tagline: Machine learning for faster, explainable, and more efficient computer systems.
intro: >
  We build learned models that predict, explain, and optimize the performance of computer systems:
  from CPU and GPU microarchitecture, to compilers, workloads, and large-scale retrieval systems.
  Our goal is to replace slow, opaque simulation and hand-tuned heuristics with models that are fast,
  accurate, and tell architects *why* a design behaves the way it does.

